<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Home Server</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a35;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #a0a0a5;
            margin-bottom: 30px;
        }
        .ssh-btn {
            display: inline-block;
            background-color: #f38020; /* Cloudflare Orange */
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(243, 128, 32, 0.3);
        }
        .ssh-btn:hover {
            background-color: #da6d13;
            transform: translateY(-2px);
        }
        .ssh-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Server Portaal</h1>
        <p>Veilig inloggen op de lokale server via Cloudflare.</p>
        
        <a href="https://ssh.yourcustomdomain.com" class="ssh-btn" target="_blank">
            Open SSH Terminal
        </a>
    </div>

</body>
</html>
